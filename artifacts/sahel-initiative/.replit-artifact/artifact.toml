kind = "web"
previewPath = "/"
title = "The Sahel Initiative"
version = "1.0.0"
id = "artifacts/sahel-initiative"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24310

[services.development]
run = "pnpm --filter @workspace/sahel-initiative run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sahel-initiative", "run", "build" ]
publicDir = "artifacts/sahel-initiative/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24310"
BASE_PATH = "/"
