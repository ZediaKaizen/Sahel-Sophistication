[build]
  command = "pnpm --filter @workspace/sahel-initiative run build"
  publish = "artifacts/sahel-initiative/dist/public"

[build.environment]
  NODE_VERSION = "24"
  NODE_ENV = "production"
  PNPM_VERSION = "10.26.1"
  BASE_PATH = "/"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
